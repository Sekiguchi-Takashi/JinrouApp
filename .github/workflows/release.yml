name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle assembleRelease --no-daemon
      - name: Sign and collect
        run: |
          mkdir -p out
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          for f in $(find app/build/outputs/apk -name "*.apk"); do
            $BT/zipalign -p -f 4 "$f" out/aligned.apk
            $BT/apksigner sign --ks ci/appathy.keystore --ks-pass pass:appathy --key-pass pass:appathy --ks-key-alias appathy --out "out/app-${GITHUB_REF_NAME}.apk" out/aligned.apk
            rm -f out/aligned.apk
          done
          ls -la out/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: out/*.apk
